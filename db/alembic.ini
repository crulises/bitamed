[alembic]
# %(here)s resolves relative to this file, so `alembic -c db/alembic.ini`
# works the same from the repo root or from inside db/, and docker-compose
# never needs to know this path changed.
script_location = %(here)s/migrations
prepend_sys_path = .

# Numbered, ordered filenames instead of a random hex slug, so
# `ls db/migrations/versions` alone tells the story in order. New revisions
# still need an explicit id: `alembic -c db/alembic.ini revision -m "..." --rev-id 0003`.
file_template = %%(rev)s_%%(slug)s

version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
